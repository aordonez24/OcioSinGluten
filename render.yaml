# Despliegue en Render (plan gratuito) con la base de datos en Supabase (PostgreSQL). Las fotos se
# guardan en la base de datos, porque el disco de Render se borra en cada reinicio.
# Paso a paso en docs/DESPLIEGUE.md.
services:
  - type: web
    name: ociosingluten
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # postgresql+psycopg://usuario.proyecto:clave@aws-1-eu-central-1.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
