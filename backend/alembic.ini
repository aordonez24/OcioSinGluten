# Solo hace falta para crear migraciones nuevas desde la línea de comandos:
#   alembic revision --autogenerate -m "describe el cambio"
# La aplicación aplica las pendientes sola al arrancar (app/db.py, función migrar).
[alembic]
script_location = app/migraciones
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
