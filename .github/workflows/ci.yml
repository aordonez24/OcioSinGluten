name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest -q

  # Las mismas pruebas contra PostgreSQL, la base de datos de producción (Supabase)
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pruebas
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:pruebas@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            e2e/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pip install -r e2e/requirements.txt && playwright install --with-deps chromium
      # Si algo falla, el resumen de cada fallo sale como anotación, visible sin abrir el log.
      - run: |
          set -o pipefail
          pytest e2e -q -rf --tb=line 2>&1 | tee e2e.log || {
            grep -E "^(FAILED|ERROR)|Error|assert" e2e.log | head -20 | while IFS= read -r linea; do echo "::error::$linea"; done
            exit 1
          }

  # App de Android: compila el APK y lo deja para descargar en la pestaña "Actions" del repositorio.
  # El servidor al que se conecta sale de la variable del repositorio SERVIDOR_APP
  # (Settings → Secrets and variables → Actions → Variables); sin ella, el servidor publicado en Render.
  android:
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SERVIDOR: ${{ vars.SERVIDOR_APP || 'https://ociosingluten.onrender.com' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run movil:android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android
      - uses: actions/upload-artifact@v5
        with:
          name: ocio-sin-gluten-android
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
