# En el plan gratuito, Supabase pausa la base de datos tras una semana sin uso y Render duerme el
# servidor a los 15 minutos. Cada tres días se visita /api/salud, que despierta el servidor y hace una
# consulta a la base de datos, para que Supabase no la pause.
# La dirección es la de Render; si cambia (dominio propio), crea la variable del repositorio
# URL_PUBLICA (Settings > Secrets and variables > Actions > Variables).
name: Mantener activo

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  visitar:
    runs-on: ubuntu-latest
    steps:
      # Render tarda hasta un minuto en despertar: se reintenta durante unos 3 minutos.
      - run: curl --fail --silent --show-error --retry 6 --retry-delay 30 --retry-all-errors --max-time 90 "${{ vars.URL_PUBLICA || 'https://ociosingluten.onrender.com' }}/api/salud"
